name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linting & Formatting
        run: |
          ruff check .

      - name: Run Mypy Type Checking
        run: |
          mypy src tests

      - name: Run Pytest Test Suite & Benchmarks
        run: |
          pytest -v -s

  linux-networking-lab:
    name: Linux Network Namespace Integration
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mini-OSPF
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Network Namespace Lab Verification
        run: |
          sudo bash lab/create_topology.sh
          sudo ip netns list
          sudo bash lab/destroy_topology.sh
